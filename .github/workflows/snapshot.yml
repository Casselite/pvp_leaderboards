name: Snapshot GW2 ladder

on:
  schedule:
    # Hourly. GitHub can delay scheduled runs by 5-20 minutes under load,
    # which is harmless: the API only recomputes the leaderboard hourly.
    - cron: "0 * * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# Needed so the job can push the snapshot back into the repo.
permissions:
  contents: write

# If a run is still going when the next hour fires, let it finish.
concurrency:
  group: ladder-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ladder and update history
        run: python snapshot.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "ladder snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Another run may have pushed while this one worked; rebase and retry.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1
