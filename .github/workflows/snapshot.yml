name: Snapshot GW2 ladder

on:
  schedule:
    # Hourly. GitHub can delay scheduled runs by 5-20 minutes under load,
    # which is harmless: the API only recomputes the leaderboard hourly.
    - cron: "0 * * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# Needed so the job can push the snapshot back into the repo.
permissions:
  contents: write

# If a run is still going when the next hour fires, let it finish.
concurrency:
  group: ladder-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # v7 runs on Node 24. There is deliberately no setup-python step:
      # ubuntu-latest already ships Python 3 and snapshot.py uses only the
      # standard library, so that is one less action to keep up to date.
      - uses: actions/checkout@v7

      - name: Fetch ladder and update history
        run: python3 snapshot.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data -- ":!*.tmp"
          git commit -m "ladder snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Someone else may have pushed while this run worked. These files are
          # single-line JSON rewritten wholesale, so a competing change to data/
          # conflicts every time - and a conflicted rebase left in progress makes
          # every later attempt fail instantly with "unmerged files". Abort any
          # in-progress rebase first, and keep our freshly collected version.
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X ours --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          git rebase --abort 2>/dev/null || true
          exit 1
