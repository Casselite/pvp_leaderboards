<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GW2 5v5 Ladder</title>
<meta name="description" content="Live top-250 Guild Wars 2 ranked 5v5 ladder with season-long history.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#F5F6F7; --surface:#FFFFFF; --surface-2:#ECEFF1;
    --ink:#14181B; --ink-2:#3D474E; --muted:#6B7780; --line:#DBE1E5;
    --accent:#2D6E8E; --accent-soft:#DCEAF1; --accent-ink:#1E5A78;
    --pos:#2E7D5B; --warn:#8A6410; --warn-soft:#F7F0DF; --neg:#A8443A; --neg-soft:#F7E9E6;
    --chart:#2D6E8E; --chart-fill:rgba(45,110,142,.14); --grid:#E4E9ED;
    --shadow:0 1px 2px rgba(20,24,27,.05),0 10px 28px -18px rgba(20,24,27,.3);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0E1215; --surface:#161C20; --surface-2:#1D252A;
      --ink:#E8EDF0; --ink-2:#BCC7CE; --muted:#8595A0; --line:#28333A;
      --accent:#5AAECF; --accent-soft:#16303D; --accent-ink:#8ACBE5;
      --pos:#5DBE92; --warn:#D6A73F; --warn-soft:#2A2314; --neg:#E08076; --neg-soft:#2B1A17;
      --chart:#5AAECF; --chart-fill:rgba(90,174,207,.18); --grid:#222C33;
      --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -18px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1215; --surface:#161C20; --surface-2:#1D252A;
    --ink:#E8EDF0; --ink-2:#BCC7CE; --muted:#8595A0; --line:#28333A;
    --accent:#5AAECF; --accent-soft:#16303D; --accent-ink:#8ACBE5;
    --pos:#5DBE92; --warn:#D6A73F; --warn-soft:#2A2314; --neg:#E08076; --neg-soft:#2B1A17;
    --chart:#5AAECF; --chart-fill:rgba(90,174,207,.18); --grid:#222C33;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -18px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);margin:0;
    font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:30px 20px 80px}
  .num{font-variant-numeric:tabular-nums}
  h1,h2,h3{font-family:Oswald,"Arial Narrow",sans-serif;font-weight:500;letter-spacing:.01em}
  code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:2px}

  header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;
    border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:20px}
  .brand h1{font-size:clamp(26px,3.6vw,38px);margin:0;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
  .brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
  .chip{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
    border-radius:3px;padding:8px 13px;box-shadow:var(--shadow)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--pos);flex:none}
  .dot.off{background:var(--muted)}
  .chip b{font-family:Oswald,sans-serif;font-weight:500;font-size:15px;display:block}
  .chip span{color:var(--muted);font-size:12.5px;display:block;line-height:1.3}

  nav{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;
    padding:2px;margin-bottom:8px;flex-wrap:wrap}
  nav button{font-family:Oswald,sans-serif;font-size:14px;letter-spacing:.06em;text-transform:uppercase;
    background:none;border:0;color:var(--muted);padding:8px 16px;border-radius:2px;cursor:pointer}
  nav button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  .bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:14px 0 16px}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:2px}
  .seg button{font-family:Oswald,sans-serif;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;
    background:none;border:0;color:var(--muted);padding:6px 16px;border-radius:2px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .note{color:var(--muted);font-size:13.5px;max-width:64ch;margin:0}
  .note b{color:var(--ink-2)}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-bottom:20px}
  .tile{background:var(--surface);padding:13px 15px}
  .tile dt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 5px;
    font-family:"JetBrains Mono",monospace}
  .tile dd{margin:0;font-family:Oswald,sans-serif;font-weight:500;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
  .tile dd small{font-size:12px;color:var(--muted);font-weight:400;font-family:"Source Sans 3",sans-serif;margin-left:5px}
  .tile.pending dd{color:var(--muted)}

  .panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-bottom:20px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:17px 19px;box-shadow:var(--shadow)}
  .panel.wide{grid-column:1/-1}
  .panel h2{font-size:16px;margin:0 0 3px;text-transform:uppercase;letter-spacing:.05em}
  .panel .sub{color:var(--muted);font-size:13px;margin:0 0 13px}
  .rows{display:flex;flex-direction:column;gap:9px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14.5px}
  .row .k{color:var(--ink-2)}
  .row .v{font-family:Oswald,sans-serif;font-weight:500;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .row .v.mut{color:var(--muted);font-size:13.5px;font-family:"Source Sans 3",sans-serif;font-weight:400}

  .chartbox{position:relative}
  svg.chart{display:block;width:100%;height:auto;overflow:visible}
  .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);
    border-radius:3px;padding:7px 10px;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5}
  .tip b{font-family:Oswald,sans-serif;font-weight:500}

  .tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow);overflow:hidden}
  .thead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 17px;border-bottom:1px solid var(--line)}
  .thead h2{font-size:16px;margin:0;text-transform:uppercase;letter-spacing:.05em}
  .search{font:inherit;font-size:14px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    border-radius:3px;padding:6px 11px;min-width:190px}
  .search:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .scroll{overflow-x:auto;max-height:660px;overflow-y:auto}
  table{border-collapse:collapse;width:100%;font-size:14px;min-width:760px}
  thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-family:"JetBrains Mono",monospace;
    font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;
    padding:9px 13px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
  th.n,td.n{text-align:right}
  tbody td{padding:9px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:var(--surface-2)}
  td.rk{font-family:Oswald,sans-serif;font-weight:500;font-size:16px;color:var(--muted);width:1%}
  td.rk.top{color:var(--accent-ink)}
  td.nm{font-family:"JetBrains Mono",monospace;font-size:13px}
  td.rt{font-family:Oswald,sans-serif;font-weight:500;font-size:16px}
  .tier{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
    padding:2px 6px;border-radius:2px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
  .wr.hi{color:var(--pos)} .wr.lo{color:var(--neg)}
  .pill{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 6px;border-radius:2px;white-space:nowrap}
  .p-new{background:var(--accent-soft);color:var(--accent-ink)}

  .state{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:40px 28px;text-align:center;box-shadow:var(--shadow)}
  .state h2{font-size:20px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}
  .state p{color:var(--ink-2);margin:0 auto;max-width:58ch}
  .state .big{font-family:Oswald,sans-serif;font-size:42px;color:var(--accent);line-height:1;margin-bottom:10px}
  .state.err{border-left:3px solid var(--neg)}
  .btn{font:inherit;font-family:Oswald,sans-serif;font-size:14px;letter-spacing:.05em;text-transform:uppercase;
    background:var(--accent);color:#fff;border:0;border-radius:3px;padding:10px 20px;cursor:pointer;margin-top:14px}
  .btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.55;cursor:default}
  .btn:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
  .hidden{display:none!important}

  tbody tr.click{cursor:pointer}
  tbody tr.open td{background:var(--accent-soft)}
  tr.detailrow td{background:var(--surface-2);padding:16px 18px;white-space:normal}
  .detail .dstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
  .detail .dk{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted)}
  .detail .dv{display:block;font-family:Oswald,sans-serif;font-size:19px;font-variant-numeric:tabular-nums}
  table.dtable{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:3px}
  table.dtable thead th{background:var(--surface)}
  tbody tr.click:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  footer{margin-top:34px;color:var(--muted);font-size:13px;max-width:80ch}
  footer a{color:var(--accent-ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>GW2 5v5 Ladder</h1>
      <p>Top 250 ranked ladder, recorded hourly</p>
    </div>
    <div class="chip">
      <span class="dot off" id="sdot"></span>
      <div><b id="sname">Loading…</b><span id="sdates">reading the API</span></div>
    </div>
  </header>

  <nav role="tablist">
    <button id="t-ladder" role="tab" aria-selected="true">Ladder</button>
    <button id="t-pop"    role="tab" aria-selected="false">Population</button>
    <button id="t-seasons" role="tab" aria-selected="false">Past seasons</button>
  </nav>

  <div class="bar" id="regionbar">
    <div class="seg" id="regionseg" role="group" aria-label="Region">
      <button id="btn-na" aria-pressed="true">NA</button>
      <button id="btn-eu" aria-pressed="false">EU</button>
    </div>
    <p class="note" id="regionnote"></p>
  </div>

  <div id="view"></div>

  <footer>
    <p id="foot">Live board from the official Guild Wars 2 API. Season history collected hourly by a GitHub Actions job in this repository and read from <code>data/history.json</code> — it keeps running whether or not anyone has this page open.</p>
    <p id="histfoot"></p>
  </footer>
</div>

<script>
(function(){
"use strict";
const API="https://api.guildwars2.com/v2";
const HISTORY_URL="data/history.json";
const WEEKLY_MATCH_STEP=15;          // each week of an active season adds 15 to the minimum
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;};
const fmt=n=>(n==null||!isFinite(n))?"—":Number(n).toLocaleString();
// "2026-09-09" parses as UTC midnight, which formats as the previous day
// anywhere west of Greenwich. Build a local date from the parts instead.
const dayLabel=(key,opts)=>{const[y,m,d]=key.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,opts||{month:"short",day:"numeric"});};
const pct=n=>(n==null||!isFinite(n))?"—":n.toFixed(1)+"%";
const S={tab:"ladder",region:"na",season:null,tiers:[],boards:{},hist:null,identical:false,seasons:null};

async function jget(url){
  const r=await fetch(url,{headers:{Accept:"application/json"}});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return {data:await r.json(),total:Number(r.headers.get("X-Result-Total")||0)};
}

/* ---------- season + board ---------- */
async function seasonList(){
  if(S.seasons) return S.seasons;
  const ids=(await jget(API+"/pvp/seasons")).data;
  const objs=(await jget(API+"/pvp/seasons?lang=en&ids="+ids.slice(-20).join(","))).data;
  S.seasons=objs; return objs;
}
async function resolveSeason(){
  const objs=await seasonList();
  const a=objs.find(s=>s.active);
  if(a) return a;
  const d=objs.filter(s=>s.start).sort((x,y)=>String(y.start).localeCompare(String(x.start)));
  return d[0];
}
function tiersFrom(s){
  // Each rank carries three tiers with their own rating ceilings, so a rating
  // resolves to "Gold 2", not just "Gold".
  const out=[];
  (s.ranks||[]).forEach(r=>{(r.tiers||[]).forEach((t,i)=>{
    if(t&&t.rating!=null) out.push({name:`${r.name} ${i+1}`,ceil:t.rating});});});
  return out.sort((a,b)=>a.ceil-b.ceil);
}
const tierOf=v=>{if(v==null)return"—";for(const t of S.tiers){if(v<=t.ceil)return t.name;}
  return S.tiers.slice(-1)[0]?.name||"—";};
function scoreMap(s){
  const m={};((s.leaderboards||{}).ladder||{}).scorings?.forEach(x=>{
    const n=String(x.name||"").toLowerCase(); if(n)m[n]=x.id;});
  return m;
}
async function loadBoard(id,region){
  // Paginate by page size, NOT by the X-Result-Total header: that header is not
  // CORS-safelisted, so cross-origin JavaScript cannot read it and it comes back
  // null in the browser. Stop on the first short page instead.
  const SIZE=200; let all=[];
  for(let p=0;p<4;p++){
    const {data}=await jget(`${API}/pvp/seasons/${id}/leaderboards/ladder/${region}?page=${p}&page_size=${SIZE}`);
    if(!Array.isArray(data)||!data.length)break;
    all=all.concat(data);
    if(data.length<SIZE)break;
  }
  return {rows:all,total:all.length};
}
function shape(rows,m){
  const g=(e,k)=>{const id=m[k];if(!id)return null;const s=(e.scores||[]).find(x=>x.id===id);return s?Number(s.value):null;};
  return rows.map(e=>{const w=g(e,"wins"),l=g(e,"losses"),games=(w==null&&l==null)?null:(w||0)+(l||0);
    return{name:e.name,rank:e.rank,date:e.date,rating:g(e,"rating"),wins:w,losses:l,games,
      wr:games?(w/games)*100:null};}).sort((a,b)=>a.rank-b.rank);
}

/* ---------- pace ----------
   Games per day since the player joined the board. Uses only the live entry
   (join date + cumulative games), so it works with zero collected history. */
function pace(r){
  // r.games is cumulative for the WHOLE season; r.date is only when the account
  // entered the top 250. Dividing one by the other gave 800 games/day for anyone
  // who ground below the cut and then broke in. The season start is the only
  // denominator that matches the numerator.
  if(r.games==null||!S.season?.start)return null;
  const days=(Date.now()-new Date(S.season.start))/864e5;
  if(!(days>0.5))return null;
  return r.games/days;
}

/* ---------- stats ---------- */
function stats(rows){
  if(!rows.length)return null;
  const rat=rows.map(r=>r.rating).filter(n=>n!=null).sort((a,b)=>a-b);
  const gm=rows.map(r=>r.games).filter(n=>n!=null).sort((a,b)=>a-b);
  const q=(a,p)=>a.length?a[Math.min(a.length-1,Math.round((a.length-1)*p))]:null;
  const at=n=>{const r=rows.find(x=>x.rank===n);return r?r.rating:null;};
  const wrs=rows.map(r=>r.wr).filter(n=>n!=null).sort((a,b)=>a-b);
  return{count:rows.length,top:rows[0],cut10:at(10),cut25:at(25),cut100:at(100),
    cut250:at(250)??rat[0],medRating:q(rat,.5),medGames:q(gm,.5),
    totalGames:rows.reduce((a,r)=>a+(r.games||0),0),
    gap:(rows[0]&&rows[1])?rows[0].rating-rows[1].rating:null,
    spread:rat.length?rat[rat.length-1]-rat[0]:null,
    medWr:wrs.length?wrs[Math.floor(wrs.length/2)]:null,
    mostGames:rows.slice().sort((a,b)=>(b.games||0)-(a.games||0))[0],
    bestWr:rows.filter(r=>r.games>=20).sort((a,b)=>(b.wr||0)-(a.wr||0))[0]};
}

/* ---------- the one chart ----------
   Cumulative distinct accounts that have appeared in the top 250 this season.
   This is the only chart on the page: it is the one quantity whose SHAPE says
   something a number cannot. Flattening means a fixed pool trading places;
   still climbing means a steady stream of new faces. */
function everChart(series){
  const box=el("div","chartbox");
  const pts=series.filter(p=>p.ever!=null&&p.t);
  if(pts.length<3){box.appendChild(el("p","note","Needs a few hours of snapshots before the curve means anything."));return box;}
  const W=980,H=260,ML=52,MR=18,MT=16,MB=30,NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("class","chart");svg.setAttribute("role","img");
  svg.setAttribute("aria-label",`Distinct players ever on the board, rising to ${pts[pts.length-1].ever}`);
  const add=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);svg.appendChild(n);return n;};
  const t0=new Date(pts[0].t).getTime(),t1=new Date(pts[pts.length-1].t).getTime();
  const hi=Math.max(...pts.map(p=>p.ever)),lo=0;
  const xs=p=>ML+((new Date(p.t).getTime()-t0)/Math.max(1,t1-t0))*(W-ML-MR);
  const ys=v=>MT+(1-(v-lo)/Math.max(1,hi-lo))*(H-MT-MB);
  for(let i=0;i<=4;i++){const v=Math.round(hi*i/4),y=ys(v);
    add("line",{x1:ML,x2:W-MR,y1:y,y2:y,stroke:"var(--grid)","stroke-width":1});
    add("text",{x:ML-8,y:y+4,"text-anchor":"end",fill:"var(--muted)","font-size":11}).textContent=v;}
  let d="";pts.forEach((p,i)=>{d+=(i?" L ":"M ")+xs(p)+" "+ys(p.ever);});
  add("path",{d:`${d} L ${xs(pts[pts.length-1])} ${H-MB} L ${xs(pts[0])} ${H-MB} Z`,fill:"var(--chart-fill)"});
  add("path",{d,fill:"none",stroke:"var(--chart)","stroke-width":2,"stroke-linejoin":"round"});
  const last=pts[pts.length-1];
  add("circle",{cx:xs(last),cy:ys(last.ever),r:4,fill:"var(--chart)",stroke:"var(--surface)","stroke-width":2});
  const lb=add("text",{x:xs(last)-8,y:ys(last.ever)-10,"text-anchor":"end",fill:"var(--ink)","font-size":13,
    "font-family":"Oswald, sans-serif"});lb.textContent=fmt(last.ever);
  const days=[...new Set(pts.map(p=>p.t.slice(0,10)))];
  // Thin the labels: one per day becomes an unreadable smear over a 12-week season.
  const stride=Math.max(1,Math.ceil(days.length/8));
  days.forEach((day,i)=>{
    if(i%stride && i!==days.length-1)return;
    const p=pts.find(x=>x.t.slice(0,10)===day);
    add("text",{x:xs(p),y:H-10,"text-anchor":"middle",fill:"var(--muted)","font-size":11})
      .textContent=dayLabel(day);});
  box.appendChild(svg);
  const tip=el("div","tip");box.appendChild(tip);
  const hit=add("rect",{x:ML,y:MT,width:W-ML-MR,height:H-MT-MB,fill:"transparent"});
  hit.addEventListener("mousemove",ev=>{
    const b=svg.getBoundingClientRect(),rel=((ev.clientX-b.left)/b.width)*W;
    let best=pts[0],bd=1e9;
    pts.forEach(p=>{const dd=Math.abs(xs(p)-rel);if(dd<bd){bd=dd;best=p;}});
    tip.innerHTML=`<b>${fmt(best.ever)}</b> distinct players<br>${new Date(best.t).toLocaleString()}`;
    tip.style.opacity=1;
    tip.style.left=Math.min(b.width-tip.offsetWidth-6,Math.max(0,(xs(best)/W)*b.width-tip.offsetWidth/2))+"px";
    tip.style.top=((ys(best.ever)/H)*b.height-tip.offsetHeight-10)+"px";});
  hit.addEventListener("mouseleave",()=>{tip.style.opacity=0;});
  return box;
}

/* ---------- views ---------- */
function tiles(board,agg){
  const st=board?stats(board.rows):null;
  const ever=agg&&agg.players?Object.keys(agg.players).length:null;
  const box=el("dl","tiles");

    const pd=pace(r);
    tr.appendChild(el("td","n num",pd==null?"—":pd.toFixed(1)));
    tr.classList.add("click");
    // Deliberately NOT role="button": that would override the implicit row role

    tr.tabIndex=0;

    tr.setAttribute("aria-label","Show recorded history for "+r.name);
    const open=()=>toggleRow(tr,r,9);
    tr.addEventListener("click",open);
    tr.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});
    tb.appendChild(tr);});
  t.appendChild(tb);sc.appendChild(t);wrap.appendChild(sc);
  // Only the account rows carry data-name. querySelectorAll("tr") also matches
  // an injected detail row and every row of the nested session table, which have
  // no dataset.name - that threw and killed the filter for the rest of the page.
  inp.addEventListener("input",()=>{
    const q=inp.value.trim().toLowerCase();

      tr.hidden=hide;

      if(d&&d.classList.contains("detailrow"))d.hidden=hide;   // keep the pair together
    });});

function populationView(){
  const v=document.createDocumentFragment();
  const agg=S.hist?.regions?.[S.region];
  const series=(agg&&Array.isArray(agg.series))?agg.series:[];
  const players=(agg&&agg.players)?agg.players:null;
  const snaps=agg?.snapshots||0;

  if(!players||!snaps){
    const d=el("div","state");
    d.appendChild(el("h2",null,"No history collected yet"));
    d.appendChild(el("p",null,"The hourly collector has not written anything for this season. Everything on this tab is built from accumulated snapshots, so it appears once the job has run a few times."));
    v.appendChild(d);return v;
  }

  const names=Object.keys(players);
  const ever=names.length;
  // "Core" = present in at least half the snapshots. With 250 slots and heavy
  // churn this is the number that answers "how many people actually hold the board".
  const core=names.filter(n=>(players[n].n||0)>=Math.max(2,snaps*0.5)).length;
  const once=names.filter(n=>(players[n].n||0)<=1).length;
  const onBoard=S.boards[S.region]?.rows.length||0;

  const today=new Date().toISOString().slice(0,10);
  const byDay={};
  series.forEach(p=>{const d=(p.t||"").slice(0,10);if(!d)return;
    byDay[d]=byDay[d]||{d,new:0,gone:0,stab:[],ever:null,c:null};
    byDay[d].new+=p.new||0; byDay[d].gone+=p.gone||0;
    if(p.stab!=null)byDay[d].stab.push(p.stab);
    byDay[d].ever=p.ever; byDay[d].c=p.c;});
  const days=Object.values(byDay).sort((a,b)=>a.d.localeCompare(b.d));
  const newToday=byDay[today]?byDay[today].new:0;
  const lastStab=(()=>{for(let i=series.length-1;i>=0;i--)if(series[i].stab!=null)return series[i].stab;return null;})();

  const box=el("dl","tiles");
  [["Distinct players ever",fmt(ever),"this season"],
   ["Active core",fmt(core),"in ≥half the snapshots"],
   ["Seen only once",fmt(once),ever?pct(once/ever*100)+" of all":null],
   ["New faces today",fmt(newToday),null],
   ["Board stability",lastStab!=null?pct(lastStab*100):"—","vs last hour"],
   ["Currently on board",fmt(onBoard),null]]
  .forEach(([k,val,sm])=>{const d=el("div","tile"+(val==="—"?" pending":""));
    d.appendChild(el("dt",null,k));const dd=el("dd",null,val);
    if(sm)dd.appendChild(el("small",null,sm));d.appendChild(dd);box.appendChild(d);});
  v.appendChild(box);

  const p1=el("div","panel wide");
  p1.appendChild(el("h2",null,"Distinct players over the season"));
  p1.appendChild(el("p","sub","Every account that has appeared in the top 250 at least once, cumulative. The board holds 250 at a time — this is how many different people pass through it."));
  p1.appendChild(everChart(series));
  p1.appendChild(el("p","note","If this flattens, the same group is trading places. If it keeps climbing, new players keep breaking in — and the gap between this number and the active core is the size of the churn."));
  v.appendChild(p1);

  const wrap=el("div","tablewrap");
  const head=el("div","thead");
  head.appendChild(el("h2",null,"By day"));
  head.appendChild(el("p","note",`${fmt(snaps)} snapshots recorded.`));
  wrap.appendChild(head);
  const sc=el("div","scroll"),t=el("table");
  t.innerHTML=`<thead><tr><th>Day</th><th class="n">New faces</th><th class="n">Dropped off</th>
    <th class="n">Net</th><th class="n">Stability</th><th class="n">Distinct total</th></tr></thead>`;
  const tb=el("tbody");
  days.slice().reverse().forEach(d=>{
    const tr=el("tr");
    tr.appendChild(el("td","num",dayLabel(d.d,{weekday:"short",month:"short",day:"numeric"})));
    tr.appendChild(el("td","n num",fmt(d.new)));
    tr.appendChild(el("td","n num",fmt(d.gone)));
    const net=el("td","n num");const nv=d.new-d.gone;
    net.textContent=(nv>0?"+":"")+nv;
    if(nv>0)net.style.color="var(--pos)";else if(nv<0)net.style.color="var(--neg)";
    tr.appendChild(net);
    const st=d.stab.length?d.stab.reduce((a,b)=>a+b,0)/d.stab.length:null;
    tr.appendChild(el("td","n num",st!=null?pct(st*100):"—"));
    tr.appendChild(el("td","n num",fmt(d.ever)));
    tb.appendChild(tr);});
  t.appendChild(tb);sc.appendChild(t);wrap.appendChild(sc);
  v.appendChild(wrap);

  const note=el("p","note");note.style.marginTop="14px";
  note.innerHTML="Being on the board needs top-250 rating <em>and</em> enough matches played — and that match minimum rises by "+WEEKLY_MATCH_STEP+" every week of the season. So drop-offs mix people who lost rating with people who simply stopped playing enough, and the second group grows as the season goes on.";
  v.appendChild(note);
  return v;
}

async function loadSeasons(btn,out){
  btn.disabled=true;btn.textContent="Loading…";
  out.innerHTML="";
  try{
    const all=await seasonList();
    const fives=all.filter(s=>s.start&&!/2v2|3v3/i.test(s.name||"")&&!s.active)
      .sort((a,b)=>String(b.start).localeCompare(String(a.start))).slice(0,8);
    const rowsOut=[];
    for(const s of fives){
      const key="gw2season:"+s.id;
      let rec=null;
      try{rec=JSON.parse(localStorage.getItem(key)||"null");}catch(e){rec=null;}
      if(!rec){
        const b=await loadBoard(s.id,"na");
        const r=shape(b.rows,scoreMap(s));
        const rat=r.map(x=>x.rating).filter(n=>n!=null).sort((a,b)=>a-b);
        rec={name:s.name,start:s.start,end:s.end,count:r.length,
          top:r[0]?r[0].rating:null,topName:r[0]?r[0].name:null,
          cut:rat.length?rat[0]:null,med:rat.length?rat[Math.floor(rat.length/2)]:null,
          games:r.reduce((a,x)=>a+(x.games||0),0)};
        // Only cache a real result. An empty board (API no longer serving an old
        // season) would otherwise be cached permanently with no way to recover.
        if(rec.count>0){try{localStorage.setItem(key,JSON.stringify(rec));}catch(e){}}
      }
      rowsOut.push(rec);
      btn.textContent=`Loading… ${rowsOut.length}/${fives.length}`;
    }
    const wrap=el("div","tablewrap");wrap.style.marginTop="16px";
    const sc=el("div","scroll"),t=el("table");
    t.innerHTML=`<thead><tr><th>Season</th><th>Ended</th><th class="n">On board</th>
      <th class="n">Top rating</th><th>Held by</th><th class="n">Cut line</th><th class="n">Median</th><th class="n">Games</th></tr></thead>`;
    const tb=el("tbody");
    rowsOut.forEach(r=>{const tr=el("tr");
      tr.appendChild(el("td",null,r.name));
      tr.appendChild(el("td","num",r.end?new Date(r.end).toLocaleDateString(undefined,{month:"short",year:"numeric"}):"—"));
      tr.appendChild(el("td","n num",fmt(r.count)));
      tr.appendChild(el("td","rt n num",fmt(r.top)));
      tr.appendChild(el("td","nm",r.topName||"—"));
      tr.appendChild(el("td","n num",fmt(r.cut)));
      tr.appendChild(el("td","n num",fmt(r.med)));
      tr.appendChild(el("td","n num",fmt(r.games)));
      tb.appendChild(tr);});
    t.appendChild(tb);sc.appendChild(t);wrap.appendChild(sc);out.appendChild(wrap);
    btn.textContent="Reload";btn.disabled=false;
  }catch(e){
    out.appendChild(el("p","note","Could not load past seasons: "+(e.message||e)));
    btn.textContent="Try again";btn.disabled=false;
  }
}

/* ---------- player detail, inline ----------
   Expands under the clicked row instead of opening a window. Consecutive points
   in the player's file give the wins/losses delta for that interval, which is as
   close to a match log as this API gets. */
async function buildDetail(row){
  const box=el("div","detail");
  box.appendChild(el("p","note","Loading recorded history…"));
  let doc=null;
  try{
    const r=await fetch("data/players/"+encodeURIComponent(row.name)+".json",{cache:"no-cache"});
    if(r.ok)doc=await r.json();
  }catch(e){}
  box.innerHTML="";
  const pts=(doc&&Array.isArray(doc.points))?doc.points:[];
  if(pts.length<2){
    box.appendChild(el("p","note",pts.length
      ?"Only one reading recorded so far. The collector adds one every hour."
      :"No history recorded for this account yet. The collector adds a reading every hour; new entries show up within the hour."));
    return box;
  }
  const first=pts[0],last=pts[pts.length-1];
  const sum=el("div","dstats");
  [["Readings",fmt(pts.length)],
   ["Best rank",fmt(Math.min(...pts.map(p=>p[1]).filter(v=>v!=null)))],
   ["Best rating",fmt(Math.max(...pts.map(p=>p[2]).filter(v=>v!=null)))],
   ["Rating change",((last[2]-first[2])>0?"+":"")+fmt(last[2]-first[2])],
   ["Games in window",fmt((last[3]+last[4])-(first[3]+first[4]))],
   ["Tracked since",new Date(first[0]).toLocaleDateString(undefined,{month:"short",day:"numeric"})]]
  .forEach(([k,v])=>{const d=el("div");d.appendChild(el("span","dk",k));d.appendChild(el("span","dv",v));sum.appendChild(d);});
  box.appendChild(sum);

  const iv=[];
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i];
    const dw=(b[3]??0)-(a[3]??0),dl=(b[4]??0)-(a[4]??0);
    if(dw+dl<=0)continue;
    iv.push({to:b[0],w:dw,l:dl,dr:(b[2]??0)-(a[2]??0),from:a[1],rank:b[1]});
  }
  if(!iv.length){box.appendChild(el("p","note","No games played between any two readings yet."));return box;}
  const t=el("table","dtable");
  t.innerHTML=`<thead><tr><th>When</th><th class="n">W</th><th class="n">L</th>
    <th class="n">Rating</th><th class="n">Rank</th></tr></thead>`;
  const tb=el("tbody");
  iv.slice().reverse().slice(0,40).forEach(v=>{
    const tr=el("tr");
    tr.appendChild(el("td","num",new Date(v.to).toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})));
    tr.appendChild(el("td","n num",String(v.w)));
    tr.appendChild(el("td","n num",String(v.l)));
    const dr=el("td","n num");dr.textContent=(v.dr>0?"+":"")+v.dr;
    if(v.dr>0)dr.style.color="var(--pos)";else if(v.dr<0)dr.style.color="var(--neg)";
    tr.appendChild(dr);
    const rk=el("td","n num");
    rk.textContent=(v.from!=null&&v.rank!=null&&v.from!==v.rank)?`${v.from} → ${v.rank}`:String(v.rank??"—");
    tr.appendChild(rk);tb.appendChild(tr);});
  t.appendChild(tb);box.appendChild(t);
  if(iv.length>40)box.appendChild(el("p","note",`Showing the 40 most recent of ${iv.length} sessions.`));
  return box;
}

async function toggleRow(tr,row,cols){
  const nxt=tr.nextElementSibling;
  if(nxt&&nxt.classList.contains("detailrow")){
    nxt.remove();tr.classList.remove("open");tr.setAttribute("aria-expanded","false");return;}
  tr.parentNode.querySelectorAll("tr.detailrow").forEach(n=>n.remove());
  tr.parentNode.querySelectorAll("tr.open").forEach(n=>{
    n.classList.remove("open");n.setAttribute("aria-expanded","false");});
  tr.classList.add("open");tr.setAttribute("aria-expanded","true");
  const dr=el("tr","detailrow"),td=el("td");
  td.colSpan=cols;dr.appendChild(td);tr.after(dr);
  td.appendChild(await buildDetail(row));
}

/* ---------- shell ---------- */
function render(){
  const v=$("#view");v.innerHTML="";
  $("#regionbar").classList.toggle("hidden",S.tab==="seasons");
  if(S.tab==="ladder")v.appendChild(ladderView());
  else if(S.tab==="pop")v.appendChild(populationView());
  else v.appendChild(seasonsView());
}
function setTab(t){
  S.tab=t;
  [["ladder","#t-ladder"],["pop","#t-pop"],["seasons","#t-seasons"]]
    .forEach(([k,sel])=>$(sel).setAttribute("aria-selected",String(k===t)));
  render();
}
function setRegion(r){
  S.region=r;$("#btn-na").setAttribute("aria-pressed",String(r==="na"));
  $("#btn-eu").setAttribute("aria-pressed",String(r==="eu"));render();
}

async function boot(){
  $("#view").innerHTML='<div class="state"><p>Loading the ladder…</p></div>';
  // History is optional: the live board must render even if the collector
  // has not committed anything yet.
  fetch(HISTORY_URL,{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(h=>{
    S.hist=h;
    if(h&&h.updated){
      $("#histfoot").textContent="History last collected "+new Date(h.updated).toLocaleString()
        +" · "+fmt(h.regions?.na?.snapshots||0)+" snapshots recorded.";
    }
    // Two guards. Only render once the board has actually arrived - this static
    // file usually beats three chained cross-origin API calls, and rendering
    // early painted "No one has qualified yet" over a board that was still
    // loading. And re-render for Population too, not just Ladder: it is the tab
    // that consumes this data.
    if(S.boards[S.region] && S.tab!=="seasons") render();
  }).catch(()=>{});

  try{
    const season=await resolveSeason();
    S.season=season;S.tiers=tiersFrom(season);
    const m=scoreMap(season);
    $("#sname").textContent=season.name||"Unknown season";
    const fd=d=>d?new Date(d).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):"—";
    $("#sdates").textContent=`${fd(season.start)} → ${fd(season.end)}`;
    if(season.active)$("#sdot").classList.remove("off");

    const [na,eu]=await Promise.all([loadBoard(season.id,"na"),loadBoard(season.id,"eu")]);
    S.boards.na={rows:shape(na.rows,m)};S.boards.eu={rows:shape(eu.rows,m)};
    S.identical=JSON.stringify(S.boards.na.rows.map(r=>r.name))===JSON.stringify(S.boards.eu.rows.map(r=>r.name));
    // A control that visibly does nothing is worse than no control. The API
    // serves one global board for both region values, so hide the toggle while
    // that is true; the comparison above brings it back automatically if it ever changes.
    $("#regionseg").classList.toggle("hidden",S.identical);
    $("#regionnote").innerHTML=S.identical
      ?"<b>One global ladder.</b> The API accepts <code>na</code> and <code>eu</code> but returns identical boards for both, and entries carry no region field \u2014 so there is nothing to split. If ArenaNet ever separates them the toggle returns on its own."
      :"NA and EU are returning different boards \u2014 showing them separately.";
    render();
    setInterval(refresh,15*60*1000);   // API caches an hour; this only keeps an idle tab current
  }catch(e){
    const s=el("div","state err");
    s.appendChild(el("h2",null,"Could not reach the Guild Wars 2 API"));
    s.appendChild(el("p",null,String(e&&e.message||e)));
    $("#view").innerHTML="";$("#view").appendChild(s);
  }
}
async function refresh(){
  try{
    if(!S.season)return;
    // Never yank the view out from under someone. render() rebuilds from
    // scratch, which would collapse an open player row, clear the filter and
    // reset the scroll position mid-read.
    const busy=document.querySelector("tr.detailrow")
      || (document.querySelector(".search")&&document.querySelector(".search").value.trim());
    if(busy)return;
    const m=scoreMap(S.season);
    const [na,eu]=await Promise.all([loadBoard(S.season.id,"na"),loadBoard(S.season.id,"eu")]);
    S.boards.na={rows:shape(na.rows,m)};S.boards.eu={rows:shape(eu.rows,m)};
    if(S.tab!=="seasons")render();
  }catch(e){/* keep showing the last good board */}
}
